<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aram Saba Sanat Iranian - Luxury Office Furniture</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Playfair Display & Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brandNavy: '#0a111c',
                        brandSurface: '#0f1826',
                        brandBronze: '#a2825e',
                        brandGold: '#d4af37',
                        brandDark: '#06090f'
                    },
                    fontFamily: {
                        serif: ['"Playfair Display"', 'serif'],
                        sans: ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #06090f; color: #e5e7eb; }
        h1, h2, h3, .font-serif { font-family: 'Playfair Display', serif; }
        .glass-panel {
            background: rgba(15, 24, 38, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(212, 175, 55, 0.25);
        }
        .gold-gradient-text {
            background: linear-gradient(135deg, #ffffff 0%, #d4af37 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        html { scroll-behavior: smooth; }
        @keyframes fadeInScale {
            0% { opacity: 0; transform: scale(0.97); }
            100% { opacity: 1; transform: scale(1); }
        }
        .animate-fade-in { animation: fadeInScale 1.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    </style>
</head>
<body class="h-full flex flex-col selection:bg-brandGold selection:text-brandDark">

    <!-- SPLASH SCREEN -->
    <div id="splashScreen" class="fixed inset-0 z-50 bg-brandDark flex flex-col items-center justify-center p-6 transition-opacity duration-1000">
        <div class="text-center animate-fade-in max-w-md w-full p-8 sm:p-10 rounded-3xl glass-panel shadow-2xl relative overflow-hidden">
            <div class="absolute top-0 left-0 right-0 h-[2px] bg-gradient-to-r from-transparent via-brandGold to-transparent"></div>
            
            <!-- Clean Refined Monogram & Logo Mark -->
            <div class="mb-6 flex flex-col items-center">
                <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-brandNavy via-[#132238] to-brandSurface border border-brandGold/40 flex items-center justify-center shadow-xl mb-4">
                    <span class="font-serif text-2xl font-bold tracking-widest text-brandGold">AS</span>
                </div>
                <div class="w-10 h-[1px] bg-brandGold/50 mb-4"></div>
            </div>

            <!-- Company Name -->
            <h1 class="text-2xl sm:text-3xl font-serif tracking-[0.25em] gold-gradient-text mb-1 uppercase font-semibold">ARAM SABA</h1>
            <h2 class="text-xs sm:text-sm font-serif tracking-[0.35em] text-brandBronze mb-6 uppercase font-medium">SANAT IRANIAN</h2>
            <div class="w-24 h-[1px] bg-gradient-to-r from-transparent via-brandGold/50 to-transparent mx-auto mb-4"></div>
            <p class="text-[9px] uppercase tracking-[0.4em] text-gray-400 mb-8 font-sans">Office Furniture Collection</p>
            
            <button onclick="enterCatalog()" class="w-full py-4 px-8 bg-gradient-to-r from-brandBronze via-[#c5a059] to-brandGold text-brandDark font-semibold uppercase tracking-[0.2em] text-xs rounded-xl shadow-2xl hover:brightness-110 transition transform active:scale-95 border border-brandGold/40">
                Enter Digital Catalog <i class="fa-solid fa-arrow-right ml-2 text-brandDark"></i>
            </button>
        </div>
    </div>

    <!-- MAIN APP CONTAINER -->
    <div id="mainApp" class="flex-1 flex flex-col max-w-md md:max-w-4xl lg:max-w-6xl mx-auto w-full shadow-2xl bg-brandSurface border-x border-gray-800/80 relative opacity-0 transition-opacity duration-700">
        
        <!-- HEADER -->
        <header class="sticky top-0 z-30 bg-brandNavy/95 backdrop-blur-xl border-b border-brandGold/20 px-6 py-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-brandNavy to-brandSurface text-brandGold font-serif font-bold flex items-center justify-center text-sm shadow-md border border-brandGold/40">AS</div>
                <div>
                    <h2 class="text-xs sm:text-sm font-serif font-bold tracking-[0.15em] text-white">ARAM SABA SANAT</h2>
                    <p class="text-[9px] uppercase tracking-[0.25em] text-brandGold">Iranian Executive Collection</p>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="toggleAdminModal()" class="px-3.5 py-2 bg-brandNavy hover:bg-gray-800 text-brandGold rounded-xl text-xs font-medium border border-brandGold/30 transition flex items-center gap-2 shadow-lg">
                    <i class="fa-solid fa-terminal text-[11px]"></i> <span class="hidden sm:inline tracking-wider">Admin Terminal</span>
                </button>
            </div>
        </header>

        <!-- HERO & SEARCH SECTION -->
        <section class="p-6 sm:p-10 bg-gradient-to-b from-brandNavy/80 via-brandSurface to-brandSurface">
            <div class="text-center mb-8">
                <span class="text-[10px] uppercase tracking-[0.3em] text-brandGold block mb-2 font-medium">Mastercrafted Workspace Solutions</span>
                <h3 class="text-2xl sm:text-4xl font-serif text-white mb-3 tracking-wide">Elite Office Environments</h3>
                <p class="text-xs sm:text-sm text-gray-400 max-w-xl mx-auto font-light leading-relaxed">Discover uncompromising ergonomics, European walnut finishes, and bespoke executive configurations.</p>
            </div>

            <!-- SEARCH & GEMINI AI BAR -->
            <div class="relative max-w-2xl mx-auto">
                <div class="flex items-center bg-brandNavy/90 border border-brandGold/30 rounded-2xl overflow-hidden shadow-2xl focus-within:border-brandGold transition">
                    <span class="pl-4 text-brandGold text-sm"><i class="fa-solid fa-wand-magic-sparkles"></i></span>
                    <input type="text" id="searchInput" oninput="filterProducts()" placeholder="Ask AI or search executive collection (e.g., 'leather chair')..." class="w-full bg-transparent px-4 py-3.5 text-xs sm:text-sm text-gray-100 placeholder-gray-500 focus:outline-none">
                    <button onclick="askGeminiAI()" class="bg-gradient-to-r from-brandBronze to-brandGold text-brandDark px-5 py-3.5 text-[11px] font-semibold uppercase tracking-widest hover:brightness-110 transition">
                        Consult AI
                    </button>
                </div>
                <div id="aiResponseBox" class="hidden mt-3 p-4 bg-brandNavy border border-brandGold/40 rounded-2xl text-xs text-gray-200 leading-relaxed shadow-xl"></div>
            </div>

            <!-- CATEGORY TABS -->
            <div class="flex gap-2 overflow-x-auto pb-2 mt-8 no-scrollbar justify-start sm:justify-center">
                <button onclick="setCategory('all')" class="cat-btn px-5 py-2 rounded-xl text-xs font-medium bg-gradient-to-r from-brandBronze to-brandGold text-brandDark transition whitespace-nowrap shadow-md tracking-wider">All Collections</button>
                <button onclick="setCategory('Desks')" class="cat-btn px-5 py-2 rounded-xl text-xs font-medium bg-brandNavy text-gray-300 hover:bg-gray-800 border border-gray-800 transition whitespace-nowrap tracking-wider">Managerial Desks</button>
                <button onclick="setCategory('Chairs')" class="cat-btn px-5 py-2 rounded-xl text-xs font-medium bg-brandNavy text-gray-300 hover:bg-gray-800 border border-gray-800 transition whitespace-nowrap tracking-wider">Ergonomic Chairs</button>
                <button onclick="setCategory('Conference')" class="cat-btn px-5 py-2 rounded-xl text-xs font-medium bg-brandNavy text-gray-300 hover:bg-gray-800 border border-gray-800 transition whitespace-nowrap tracking-wider">Conference Tables</button>
                <button onclick="setCategory('Storage')" class="cat-btn px-5 py-2 rounded-xl text-xs font-medium bg-brandNavy text-gray-300 hover:bg-gray-800 border border-gray
