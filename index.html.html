<!DOCTYPE html>
<html lang="fa" dir="rtl" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>آرام صبا صنعت ایرانیان - مبلمان اداری لوکس</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Vazirmatn & Playfair Display & Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brandNavy: '#0a111c',
                        brandSurface: '#0f1826',
                        brandBronze: '#a2825e',
                        brandGold: '#d4af37',
                        brandDark: '#06090f'
                    },
                    fontFamily: {
                        sans: ['Vazirmatn', 'Inter', 'sans-serif'],
                        serif: ['"Playfair Display"', 'Vazirmatn', 'serif']
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Vazirmatn', 'Inter', sans-serif; background-color: #06090f; color: #e5e7eb; }
        h1, h2, h3, .font-serif { font-family: 'Playfair Display', 'Vazirmatn', serif; }
        .glass-panel {
            background: rgba(15, 24, 38, 0.9);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(212, 175, 55, 0.2);
        }
        .gold-gradient-text {
            background: linear-gradient(135deg, #ffffff 0%, #d4af37 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        html { scroll-behavior: smooth; }
        @keyframes fadeInScale {
            0% { opacity: 0; transform: scale(0.97); }
            100% { opacity: 1; transform: scale(1); }
        }
        .animate-fade-in { animation: fadeInScale 1.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    </style>
</head>
<body class="h-full flex flex-col selection:bg-brandGold selection
