<!DOCTYPE html>
<html lang="fa" dir="rtl" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#06090f">
  <meta name="description" content="کاتالوگ دیجیتال مبلمان اداری لوکس آرام صبا صنعت ایرانیان">
  <title>آرام صبا صنعت ایرانیان | مبلمان اداری لوکس</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brandNavy: '#0a111c',
            brandSurface: '#0f1826',
            brandBronze: '#a2825e',
            brandGold: '#d4af37',
            brandDark: '#06090f'
          },
          fontFamily: {
            sans: ['Vazirmatn', 'Inter', 'sans-serif'],
            serif: ['Playfair Display', 'Vazirmatn', 'serif']
          }
        }
      }
    };
  </script>

  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      min-height: 100%;
      margin: 0;
      overflow-x: hidden;
      background: #06090f;
      color: #e5e7eb;
      font-family: 'Vazirmatn', 'Inter', sans-serif;
    }
    h1, h2, h3, h4, .font-serif { font-family: 'Playfair Display', 'Vazirmatn', serif; }
    button, input, select, textarea { font: inherit; }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
      outline: 2px solid #d4af37;
      outline-offset: 3px;
    }
    .glass-panel {
      background: rgba(15, 24, 38, .88);
      border: 1px solid rgba(212, 175, 55, .2);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }
    .gold-gradient-text {
      background: linear-gradient(135deg, #fff 0%, #d4af37 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .gold-button {
      color: #06090f;
      background: linear-gradient(110deg, #a2825e, #c5a059, #d4af37);
    }
    .gold-button:hover { filter: brightness(1.08); box-shadow: 0 10px 28px rgba(212,175,55,.18); }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { scrollbar-width: none; -ms-overflow-style: none; }
    .fade-in { animation: fadeIn .65s ease both; }
    .fade-up { animation: fadeUp .65s cubic-bezier(.22,1,.36,1) both; }
    @keyframes fadeIn { from { opacity: 0; transform: scale(.985); } to { opacity: 1; transform: scale(1); } }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
    .product-card { transition: transform .35s ease, border-color .35s ease, box-shadow .35s ease; }
    .product-card:hover { transform: translateY(-6px); border-color: rgba(212,175,55,.38); box-shadow: 0 22px 55px rgba(0,0,0,.42); }
    .product-image { transition: transform 1s cubic-bezier(.2,.8,.2,1); }
    .product-card:hover .product-image { transform: scale(1.055); }
    .modal-scroll { overscroll-behavior: contain; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>

<body class="min-h-screen flex flex-col selection:bg-brandGold selection:text-brandDark">
  <!-- Ambient background -->
  <div aria-hidden="true" class="fixed -top-48 -left-40 w-[65vw] h-[65vw] rounded-full bg-brandGold/[.045] blur-[120px] pointer-events-none"></div>
  <div aria-hidden="true" class="fixed -bottom-40 -right-40 w-[55vw] h-[55vw] rounded-full bg-brandBronze/[.05] blur-[110px] pointer-events-none"></div>

  <!-- Intro screen -->
  <section id="splashScreen" class="fixed inset-0 z-50 flex items-center justify-center bg-brandDark p-5 transition-opacity duration-700" aria-label="صفحه ورود">
    <div class="glass-panel relative w-full max-w-lg overflow-hidden rounded-[2rem] p-7 text-center shadow-2xl sm:p-10 fade-in">
      <div class="absolute inset-x-0 top-0 h-px bg-gradient-to-r from-transparent via-brandGold to-transparent"></div>
      <div dir="ltr" class="mb-6 flex items-baseline justify-center gap-1">
        <span class="font-serif text-6xl font-light tracking-tighter text-gray-100">A</span>
        <span class="gold-gradient-text font-serif text-6xl font-light italic tracking-tighter">S</span>
      </div>
      <p dir="ltr" class="gold-gradient-text mb-2 font-serif text-2xl font-semibold tracking-[.2em] sm:text-3xl">ARAM SABA</p>
      <p dir="ltr" class="mb-5 font-serif text-sm font-medium tracking-[.28em] text-brandBronze">SANAT IRANIAN</p>
      <div class="mx-auto mb-5 h-px w-20 bg-brandGold/40"></div>
      <p dir="ltr" class="mb-9 text-[10px] uppercase tracking-[.35em] text-gray-400">Exquisite Office Architecture</p>
      <button id="enterButton" type="button" class="gold-button w-full rounded-xl px-7 py-4 text-xs font-bold transition hover:scale-[1.01] active:scale-[.99]">
        ورود به کاتالوگ دیجیتال <i class="fa-solid fa-arrow-left mr-2"></i>
      </button>
    </div>
  </section>

  <!-- Main application -->
  <div id="mainApp" class="relative z-10 flex min-h-screen w-full flex-1 flex-col opacity-0 transition-opacity duration-700">
    <header class="sticky top-0 z-30 flex items-center justify-between border-b border-brandGold/10 bg-[#06090f]/85 px-4 py-3 backdrop-blur-2xl sm:px-7 sm:py-4">
      <a href="#" class="group flex min-w-0 items-center gap-3 no-underline" aria-label="صفحه اصلی">
        <span dir="ltr" class="flex h-11 w-11 shrink-0 items-center justify-center rounded-xl border border-white/20 bg-gradient-to-br from-brandBronze to-brandGold font-serif text-lg font-bold text-brandDark shadow-lg transition group-hover:scale-105">AS</span>
        <span class="min-w-0">
          <span class="block truncate text-xs font-bold tracking-wide text-gray-100 transition group-hover:text-brandGold sm:text-sm">آرام صبا صنعت ایرانیان</span>
          <span class="mt-1 block text-[10px] uppercase tracking-wider text-brandGold/80">Executive Collection</span>
        </span>
      </a>
      <button id="openAdminButton" type="button" class="rounded-xl border border-white/10 bg-white/5 px-3 py-2.5 text-xs font-medium text-brandGold transition hover:border-brandGold/40 hover:bg-white/10 sm:px-4">
        <i class="fa-solid fa-sliders ml-1.5"></i><span class="hidden sm:inline">مدیریت کاتالوگ</span><span class="sm:hidden">مدیریت</span>
      </button>
    </header>

    <section class="relative px-5 pb-4 pt-14 sm:px-10 sm:pt-20">
      <div class="relative z-10 mx-auto mb-10 max-w-4xl text-center">
        <span class="mb-4 block text-[10px] font-medium uppercase tracking-[.3em] text-brandGold/80 fade-up">Bespoke Office Solutions</span>
        <h1 class="mb-5 text-3xl font-bold leading-[1.7] text-white fade-up sm:text-5xl">
          مبلمان اداری و فضاهای<br><span class="gold-gradient-text">مدیریتی لوکس</span>
        </h1>
        <p class="mx-auto max-w-2xl text-xs font-light leading-8 text-gray-400 fade-up sm:text-sm">
          تلفیق ارگونومی پیشرفته، متریال ممتاز و طراحی سفارشی برای خلق فضاهای کاری متمایز.
        </p>
      </div>

      <div class="relative z-20 mx-auto max-w-3xl fade-up">
        <div class="flex flex-col gap-2 rounded-2xl border border-white/10 bg-white/[.045] p-2 shadow-2xl backdrop-blur-xl transition focus-within:border-brandGold/40 sm:flex-row sm:items-center">
          <label for="searchInput" class="flex min-w-0 flex-1 items-center gap-3 px-3">
            <i class="fa-solid fa-magnifying-glass text-brandGold"></i>
            <input id="searchInput" type="search" autocomplete="off" placeholder="جستجو در نام یا مشخصات محصولات..." class="w-full min-w-0 bg-transparent py-3 text-xs text-gray-100 outline-none placeholder:text-gray-500 sm:text-sm">
          </label>
          <button id="aiButton" type="button" class="gold-button shrink-0 rounded-xl px-5 py-3 text-[11px] font-bold transition">
            <i class="fa-solid fa-wand-magic-sparkles ml-1"></i> مشاوره هوشمند
          </button>
        </div>
        <div id="aiResponseBox" class="mt-4 hidden rounded-2xl border border-brandGold/30 bg-[#0a111c]/95 p-5 text-xs leading-8 text-gray-300 shadow-xl" aria-live="polite"></div>
      </div>

      <nav id="categoryTabs" class="no-scrollbar relative z-10 mt-10 flex justify-start gap-2.5 overflow-x-auto pb-3 sm:justify-center" aria-label="فیلتر دسته‌بندی‌ها"></nav>
    </section>

    <main class="mx-auto w-full max-w-[1400px] flex-1 px-5 pb-16 pt-4 sm:px-10">
      <div class="mb-6 flex items-center justify-between gap-3 border-b border-white/5 pb-4">
        <div>
          <h2 class="text-sm font-bold text-gray-100">منتخب کلکسیون</h2>
          <p id="resultCount" class="mt-1 text-[10px] text-gray-500"></p>
        </div>
        <span class="hidden text-[10px] tracking-widest text-brandGold/70 sm:inline">ARAM SABA COLLECTION</span>
      </div>
      <div id="productGrid" class="grid grid-cols-1 gap-6 md:grid-cols-2 xl:grid-cols-3"></div>
    </main>

    <footer class="relative z-10 border-t border-white
