<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aram Saba Sanat Iranian - Luxury Office Furniture</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Playfair Display & Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brandNavy: '#0a111c',
                        brandSurface: '#0f1826',
                        brandBronze: '#a2825e',
                        brandGold: '#d4af37',
                        brandDark: '#04060a'
                    },
                    fontFamily: {
                        serif: ['"Playfair Display"', 'serif'],
                        sans: ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #04060a; color: #e5e7eb; }
        h1, h2, h3, .font-serif { font-family: 'Playfair Display', serif; }
        .luxury-plaque {
            background: linear-gradient(145deg, #0f1826 0%, #070c14 100%);
            border: 1px solid rgba(212, 175, 55, 0.4);
            box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.9), inset 0 0 30px rgba(212, 175, 55, 0.05);
        }
        html { scroll-behavior: smooth; }
        @keyframes fadeInScale {
            0% { opacity: 0; transform: scale(0.97); }
            100% { opacity: 1; transform: scale(1); }
        }
        .animate-fade-in { animation: fadeInScale 1.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    </style>
</head>
<body class="h-full flex flex-col selection:bg-brandGold selection:text-brandDark">

    <!-- SPLASH SCREEN WITH ELITE LUXURY PLAQUE & CODED TYPOGRAPHY LOGO -->
    <div id="splashScreen" class="fixed inset-0 z-50 bg-brandDark flex flex-col items-center justify-center p-6 transition-opacity duration-1000">
        <div class="text-center animate-fade-in max-w-md w-full p-8 sm:p-10 rounded-3xl luxury-plaque relative overflow-hidden">
            <!-- Inner Gold Border Frame -->
            <div class="absolute inset-3 border border-brandGold/20 rounded-2xl pointer-events-none"></div>
            
            <!-- High-End Monogram AS -->
            <div class="flex justify-center items-center gap-3 mb-6">
                <span class="text-6xl font-serif font-bold text-gray-100 drop-shadow-md">A</span>
                <span class="text-6xl font-serif font-bold bg-gradient-to-r from-[#c5a059] to-[#dfc17b] bg-clip-text text-transparent drop-shadow-md">S</span>
            </div>

            <!-- Company Name & Typography Lockup -->
            <h1 class="text-xl sm:text-2xl font-serif tracking-[0.3em] text-white uppercase font-semibold mb-1">ARAM SABA</h1>
            <h2 class="text-xs sm:text-sm font-serif tracking-[0.35em] text-brandGold uppercase font-medium mb-4">SANAT IRANIAN</h2>
            
            <div class="w-24 h-[1px] bg-gradient-to-r from-transparent via-brandGold to-transparent mx-auto mb-4"></div>
            <p class="text-[9px] uppercase tracking-[0.4em] text-gray-400 mb-8 font-sans">OFFICE FURNITURE</p>
            
            <!-- Enter Button -->
            <button onclick="enterCatalog()" class="w-full py-4 px-8 bg-gradient-to-r from-brandBronze via-[#c5a059] to-brandGold text-brandDark font-semibold uppercase tracking-[0.2em] text-xs rounded-xl shadow-2xl hover:brightness-110 transition transform active:scale-95 border border-brandGold/50">
                ENTER DIGITAL CATALOG <i class="fa-solid fa-arrow-right ml-2 text-brandDark"></i>
            </button>
        </div>
    </div>

    <!-- MAIN APP CONTAINER -->
    <div id="mainApp" class="flex-1 flex flex-col max-w-md md:max-w-4xl lg:max-w-6xl mx-auto w-full shadow-2xl bg-brandSurface border-x border-gray-800/80 relative opacity-0 transition-opacity duration-700">
        
        <!-- HEADER -->
        <header class="sticky top-0 z-30 bg-brandNavy/95 backdrop-blur-xl border-b border-brandGold/20 px-6 py-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-brandNavy to-brandSurface text-brandGold font-serif font-bold flex items-center justify-center text-sm shadow-md border border-brandGold/40">AS</div>
                <div>
                    <h2 class="text-xs sm:text-sm font-serif font-bold tracking-[0.15em] text-white">ARAM SABA SANAT</h2>
                    <p class="text-[9px] uppercase tracking-[0.25em] text-brandGold">Iranian Executive Collection</p>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="toggleAdminModal()" class="px-3.5 py-2 bg-brandNavy hover:bg-gray-800 text-brandGold rounded-xl text-xs font-medium border border-brandGold/30 transition flex items-center gap-2 shadow-lg">
                    <i class="fa-solid fa-terminal text-[11px]"></i> <span class="hidden sm:inline tracking-wider">Admin Terminal</span>
                </button>
            </div>
        </header>

        <!-- HERO & SEARCH SECTION -->
        <section class="p-6 sm:p-10 bg-gradient-to-b from-brandNavy/80 via-brandSurface to-brandSurface">
            <div class="text-center mb-8">
                <span class="text-
