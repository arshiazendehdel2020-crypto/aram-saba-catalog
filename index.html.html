<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>آرام صبا صنعت ایرانیان - مبلمان اداری لوکس</title>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; scroll-behavior: smooth; }
        body {
            font-family: 'Vazirmatn', Tahoma, sans-serif;
            background-color: #06090f;
            color: #e5e7eb;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }
        h1, h2, h3, .font-serif { font-family: 'Playfair Display', 'Vazirmatn', serif; }
        .hidden { display: none !important; }

        /* Splash Screen */
        #splashScreen {
            position: fixed;
            inset: 0;
            z-index: 100;
            background-color: #06090f;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            transition: opacity 0.6s ease;
        }
        .glass-panel {
            background: rgba(15, 24, 38, 0.95);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 1.5rem;
            padding: 2.5rem 2rem;
            max-width: 30rem;
            width: 100%;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.8);
        }
        .gold-gradient {
            background: linear-gradient(135deg, #ffffff 0%, #d4af37 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Main Container */
        #mainApp {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            background: #0f1826;
            border-left: 1px solid rgba(212, 175, 55, 0.15);
            border-right: 1px solid rgba(212, 175, 55, 0.15);
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.9);
        }

        /* Header */
        header {
            position: sticky;
            top: 0;
            z-index: 40;
            background: rgba(10, 17, 28, 0.95);
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
            padding: 1rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .brand-logo {
            width: 2.5rem;
            height: 2.5rem;
            background: linear-gradient(135deg, #a2825e, #d4af37);
            color: #06090f;
            font-weight: bold;
            border-radius: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Hero */
        .hero {
            padding: 3rem 1.5rem 2rem;
            text-align: center;
            background: radial-gradient(circle at center, rgba(212, 175, 55, 0.08) 0%, transparent 70%);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .search-box {
            display: flex;
            max-width: 40rem;
            margin: 1.5rem auto 0;
            background: #0a111c;
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 1rem;
            overflow: hidden;
        }
        .search-box input {
            flex: 1;
            background: transparent;
            border: none;
            padding: 0.8rem 1rem;
            color: #fff;
            font-size: 0.85rem;
            outline: none;
            font-family: inherit;
        }

        /* Category Tabs */
        #categoryTabsContainer {
            display: flex;
            gap: 0.5rem;
            overflow-x: auto;
            padding: 1rem 0 0.5rem;
            justify-content: center;
            flex-wrap: wrap;
        }
        .cat-btn {
            padding: 0.5rem 1.2rem;
            background: #0a111c;
            color: #9ca3af;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 0.75rem;
            font-size: 0.8rem;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s;
        }
        .cat-btn.active {
            background: linear-gradient(135deg, #a2825e, #d4af37);
            color: #06090f;
            font-weight: bold;
            border-color: transparent;
        }

        /* Product Grid */
        main { flex: 1; padding: 2rem 1.5rem; }
        #productGrid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
        }
        .product-card {
            background: #0a111c;
            border: 1px solid rgba(212, 175, 55, 0.15);
            border-radius: 1rem;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: transform 0.3s;
        }
        .product-card:hover { transform: translateY(-4px); border-color: rgba(212, 175, 55, 0.4); }
        .card-img { height: 210px; background: #000; position: relative; }
        .card-img img { width: 100%; height: 100%; object-fit: cover; }
        .card-body { padding: 1.25rem; display: flex; flex-direction: column; flex: 1; text-align: right; }

        /* Modal */
        #adminModal {
            position: fixed;
            inset: 0;
            z-index: 90;
            background: rgba(0,0,0,0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .modal-content {
            background: #0a111c;
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 1.25rem;
            max-width: 40rem;
            width: 100%;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .input-field {
            width: 100%;
            background: #06090f;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 0.65rem;
            padding: 0.6rem 0.8rem;
            color: #fff;
            font-size: 0.8rem;
            font-family: inherit;
            outline: none;
        }
        .input-field:focus { border-color: #d4af37; }

        /* Toast */
        #toast {
            position: fixed;
            bottom: 1.5rem;
            left: 1.5rem;
            z-index: 110;
            background: #d4af37;
            color: #06090f;
            padding: 0.75rem 1.25rem;
            border-radius: 0.75rem;
            font-weight: bold;
            font-size: 0.8rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            transition: opacity 0.4s ease;
        }
    </style>
</head>

        <div class="glass-panel">
            <div dir="ltr" style="margin-bottom: 1.25rem;">
                <span style="font-size: 3rem; font-weight: 300;" class="font-serif">A</span>
                <span style="font-size: 3rem; font-weight: 300; font-style: italic;" class="font-serif gold-gradient">S</span>
            </div>
            <h1 style="font-size: 1.5rem; letter-spacing: 0.2em; margin-bottom: 0.2rem;" class="font-serif gold-gradient">ARAM SABA</h1>
            <h2 style="font-size: 0.8rem; letter-spacing: 0.25em; color: #a2825e; margin-bottom: 1.5rem;" class="font-serif">SANAT IRANIAN</h2>
            <div style="width: 4rem; height: 1px; background: rgba(212,175,55,0.4); margin: 0 auto 1rem;"></div>
